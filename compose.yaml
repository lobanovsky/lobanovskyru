name: lobanovskyru
services:
  site:
    image: ${SITE_IMAGE:?Set SITE_IMAGE to an immutable image tag or digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
      - /config:uid=1000,gid=1000
      - /data:uid=1000,gid=1000
    networks:
      - proxy
    labels:
      traefik.enable: "${TRAEFIK_ENABLED:-false}"
      traefik.docker.network: housekpr-network
      traefik.http.routers.lobanovskyru.rule: Host(`lobanovsky.ru`) || Host(`www.lobanovsky.ru`)
      traefik.http.routers.lobanovskyru.entrypoints: https
      traefik.http.routers.lobanovskyru.tls.certresolver: letsEncrypt
      traefik.http.services.lobanovskyru.loadbalancer.server.port: "8080"
      traefik.http.routers.lobanovsky-basket.rule: Host(`basket.lobanovsky.ru`)
      traefik.http.routers.lobanovsky-basket.entrypoints: https
      traefik.http.routers.lobanovsky-basket.tls.certresolver: letsEncrypt
      traefik.http.routers.lobanovsky-basket.service: lobanovskyru
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true
    name: housekpr-network
